<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Золотой рубль</title>
  <!-- Набросок значка: золотой знак рубля на изумрудном, в материале Ф из второго круга. Без окружности вокруг:
       знак рубля в круге — фирменный знак цифрового рубля Банка России.
       Второй вариант: штрихи тоньше, просвет чаши больше, перекладина тоньше вертикалей — горизонталь кажется толще. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14A37F"/><stop offset="1" stop-color="#0A4A3C"/>
    </linearGradient>
    <linearGradient id="gold" x1="68" y1="52" x2="188" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B8"/><stop offset="0.45" stop-color="#FFC93C"/><stop offset="1" stop-color="#E08A12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
    <path id="rub" fill-rule="evenodd" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z"/>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <use href="#rub" fill="#032A21" opacity="0.5" transform="translate(0 16)" filter="url(#shadow)"/>
  <use href="#rub" fill="#B5650B" stroke="#B5650B" stroke-width="6" stroke-linejoin="round" transform="translate(0 7)"/>
  <use href="#rub" fill="url(#gold)" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M92 55 H144 A38 38 0 0 1 176 70" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
  <path d="M95 64 V118" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
</svg>
