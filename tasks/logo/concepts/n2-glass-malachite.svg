<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Стекло · малахит</title>
  <!-- Набросок значка: фон — срез малахита, полосы разной ширины с дрейфующим центром (ровные кольца читались
       волнами вайфая); стеклянный знак в золотой оправе. -->
  <defs>
    <linearGradient id="glass" x1="68" y1="52" x2="160" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#D8FFF0" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="gold" x1="68" y1="52" x2="188" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B8"/><stop offset="0.45" stop-color="#FFC93C"/><stop offset="1" stop-color="#D98510"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="rub" fill-rule="evenodd" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z"/>
    <clipPath id="in"><use href="#rub"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="#0B5A43"/>
  <g fill="none">
    <ellipse cx="300" cy="-40" rx="70" ry="60" stroke="#26B887" stroke-width="10"/>
    <ellipse cx="296" cy="-34" rx="92" ry="80" stroke="#063F2F" stroke-width="16"/>
    <ellipse cx="290" cy="-28" rx="114" ry="102" stroke="#1C9C72" stroke-width="7"/>
    <ellipse cx="286" cy="-20" rx="132" ry="122" stroke="#0E6B50" stroke-width="12"/>
    <ellipse cx="280" cy="-14" rx="152" ry="140" stroke="#2BC491" stroke-width="5"/>
    <ellipse cx="274" cy="-6" rx="170" ry="160" stroke="#074533" stroke-width="18"/>
    <ellipse cx="268" cy="0" rx="194" ry="182" stroke="#17905F" stroke-width="8"/>
    <ellipse cx="262" cy="8" rx="214" ry="204" stroke="#0A5440" stroke-width="13"/>
    <ellipse cx="256" cy="14" rx="236" ry="224" stroke="#22AE80" stroke-width="6"/>
    <ellipse cx="250" cy="20" rx="256" ry="246" stroke="#063D2D" stroke-width="17"/>
    <ellipse cx="244" cy="26" rx="280" ry="268" stroke="#1A9A6E" stroke-width="9"/>
    <ellipse cx="238" cy="34" rx="302" ry="290" stroke="#0C5E46" stroke-width="14"/>
    <ellipse cx="232" cy="40" rx="324" ry="312" stroke="#28BC8A" stroke-width="5"/>
    <ellipse cx="226" cy="46" rx="346" ry="334" stroke="#074533" stroke-width="16"/>
  </g>
  <rect width="256" height="256" fill="url(#shade)"/>
  <use href="#rub" fill="#01140F" opacity="0.5" transform="translate(0 14)" filter="url(#shadow)"/>
  <use href="#rub" fill="url(#glass)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <path clip-path="url(#in)" d="M60 40 H120 L60 140 Z" fill="#FFFFFF" opacity="0.5"/>
</svg>
