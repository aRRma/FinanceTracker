<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Ф золотая</title>
  <!-- Набросок значка: Ф — первая буква «финансов», кириллица, которой нет у чужих знаков.
       Кольцо замкнуто и стержень выходит за него с обеих сторон — иначе читается кнопка питания. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14A37F"/><stop offset="1" stop-color="#0A4A3C"/>
    </linearGradient>
    <linearGradient id="gold" x1="60" y1="40" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B8"/><stop offset="0.45" stop-color="#FFC93C"/><stop offset="1" stop-color="#E08A12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <g transform="translate(0 16)" filter="url(#shadow)" opacity="0.5">
    <ellipse cx="128" cy="128" rx="72" ry="54" fill="none" stroke="#032A21" stroke-width="30"/>
    <rect x="114" y="34" width="28" height="188" rx="14" fill="#032A21"/>
  </g>
  <g transform="translate(0 7)">
    <ellipse cx="128" cy="128" rx="72" ry="54" fill="none" stroke="#B5650B" stroke-width="30"/>
    <rect x="114" y="34" width="28" height="188" rx="14" fill="#B5650B"/>
  </g>
  <ellipse cx="128" cy="128" rx="72" ry="54" fill="none" stroke="url(#gold)" stroke-width="30"/>
  <rect x="114" y="34" width="28" height="188" rx="14" fill="url(#gold)"/>
  <path d="M72 108 A72 54 0 0 1 112 78" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  <path d="M121 46 V96" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
</svg>
