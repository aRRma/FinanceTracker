<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Стеклянный рубль</title>
  <!-- Набросок значка: знак рубля из матового стекла, за ним мятное свечение — свет идёт изнутри плитки. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F7A5F"/><stop offset="1" stop-color="#062E25"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="124" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CF0B4" stop-opacity="0.75"/><stop offset="0.6" stop-color="#3CF0B4" stop-opacity="0.12"/><stop offset="1" stop-color="#3CF0B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="66" y1="52" x2="160" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/><stop offset="1" stop-color="#D4FFF0" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="rub" fill-rule="evenodd" d="M86 52 H144 A44 44 0 0 1 144 140 H116 V158 H154 V182 H116 V204 H86 V182 H66 V158 H86 Z M116 80 H142 A16 16 0 0 1 142 112 H116 Z"/>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#glow)"/>
  <use href="#rub" fill="#01140F" opacity="0.45" transform="translate(0 14)" filter="url(#shadow)"/>
  <use href="#rub" fill="url(#glass)" stroke="url(#glass)" stroke-width="6" stroke-linejoin="round"/>
  <use href="#rub" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round" transform="translate(0 0)"/>
</svg>
