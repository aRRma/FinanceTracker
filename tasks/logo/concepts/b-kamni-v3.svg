<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Равновесие</title>
  <!-- Три гальки друг на друге, меньшая сверху, со сдвигом: стопка неровная, а равновесие держится.
       Плоские бока и узкие просветы — камни лежат друг на друге, а не висят в воздухе.
       Стопка поднята на 10 единиц: по оптическому центру, а не по геометрическому. -->
  <g fill="#111111">
    <rect x="28" y="146" width="200" height="72" rx="52" ry="36"/>
    <rect x="52" y="86" width="136" height="52" rx="40" ry="26"/>
    <rect x="94" y="38" width="80" height="40" rx="28" ry="20"/>
  </g>
</svg>
