<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Ф, сплетённая</title>
  <!-- Набросок на плитке: кольцо и стержень буквы Ф сплетены — сверху стержень поверх кольца, снизу кольцо поверх. -->
  <defs><clipPath id="top"><rect x="0" y="0" width="256" height="110"/></clipPath></defs>
  <rect width="256" height="256" fill="#0B4D40"/>
  <rect x="114" y="22" width="28" height="212" rx="14" fill="#FFFFFF"/>
  <ellipse cx="128" cy="128" rx="80" ry="60" fill="none" stroke="#0B4D40" stroke-width="46"/>
  <ellipse cx="128" cy="128" rx="80" ry="60" fill="none" stroke="#FFC22E" stroke-width="30"/>
  <g clip-path="url(#top)">
    <rect x="106" y="14" width="44" height="228" rx="22" fill="#0B4D40"/>
    <rect x="114" y="22" width="28" height="212" rx="14" fill="#FFFFFF"/>
  </g>
</svg>
