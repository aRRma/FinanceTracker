<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Счётчик</title>
  <!-- Набросок значка: барабан механического счётчика, цифра на полпути — 0 уходит вверх, 1 входит снизу.
       Барабан ниже и шире, чем в первом варианте: высокий читался футболкой с номером. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F8BFF"/><stop offset="1" stop-color="#0A3FA8"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="52" x2="0" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7D889C"/><stop offset="0.25" stop-color="#EEF1F6"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="0.75" stop-color="#EEF1F6"/><stop offset="1" stop-color="#7D889C"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="52" x2="0" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1A3A" stop-opacity="0.6"/><stop offset="0.3" stop-color="#0A1A3A" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#0A1A3A" stop-opacity="0"/><stop offset="1" stop-color="#0A1A3A" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="window"><rect x="56" y="52" width="144" height="152" rx="22"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect x="56" y="66" width="144" height="152" rx="22" fill="#03163F" opacity="0.5" filter="url(#shadow)"/>
  <rect x="56" y="52" width="144" height="152" rx="22" fill="url(#drum)"/>
  <g clip-path="url(#window)" fill="#14213D">
    <path fill-rule="evenodd" d="M96 68 A32 32 0 0 1 160 68 V100 A32 32 0 0 1 96 100 Z M116 68 A12 12 0 0 1 140 68 V100 A12 12 0 0 1 116 100 Z"/>
    <path d="M112 168 L136 150 H156 V260 H134 V176 L112 188 Z"/>
  </g>
  <rect x="56" y="52" width="144" height="152" rx="22" fill="url(#shade)"/>
  <rect x="56" y="52" width="144" height="152" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
</svg>
