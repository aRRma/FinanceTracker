<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Приход и расход</title>
  <!-- Круг, разрезанный пополам и разведённый: левая половина — расход (минус), правая — приход (плюс).
       Знаки толще, чем в первом варианте, чтобы не пропасть на 24 px. -->
  <g fill="#111111" fill-rule="evenodd">
    <path d="M120 40 A100 100 0 0 0 120 240 Z M52 128 H108 V150 H52 Z"/>
    <path d="M136 16 A100 100 0 0 1 136 216 Z M167 88 H189 V105 H206 V127 H189 V144 H167 V127 H150 V105 H167 Z"/>
  </g>
</svg>
