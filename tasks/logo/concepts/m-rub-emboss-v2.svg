<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Тиснёный рубль</title>
  <!-- Набросок значка: знак рубля выдавлен из самой плитки, как тиснение на коже; золотая только перекладина —
       черта, которой рубль отличается от буквы Р. Второй вариант: перекладина короче и тоньше. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17A983"/><stop offset="1" stop-color="#0B5444"/>
    </linearGradient>
    <linearGradient id="face" x1="68" y1="52" x2="188" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24C99A"/><stop offset="1" stop-color="#0E6D57"/>
    </linearGradient>
    <linearGradient id="gold" x1="68" y1="154" x2="152" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B8"/><stop offset="0.5" stop-color="#FFC93C"/><stop offset="1" stop-color="#E08A12"/>
    </linearGradient>
    <path id="body" fill-rule="evenodd" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V204 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z"/>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <use href="#body" fill="#043A2E" opacity="0.55" transform="translate(5 6)"/>
  <use href="#body" fill="#7DF2CC" opacity="0.6" transform="translate(-3 -3)"/>
  <use href="#body" fill="url(#face)" stroke="url(#face)" stroke-width="6" stroke-linejoin="round"/>
  <rect x="70" y="160" width="84" height="22" rx="5" fill="#043A2E" opacity="0.5"/>
  <rect x="66" y="153" width="88" height="23" rx="5" fill="url(#gold)"/>
  <path d="M71 157 H149" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round"/>
</svg>
