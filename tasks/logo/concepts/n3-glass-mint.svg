<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Стекло · мятный лёд</title>
  <!-- Набросок значка: светлая мятная плитка, знак из тёмно-зелёного стекла — светлый значок среди тёмных. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6FFF3"/><stop offset="1" stop-color="#6EDDB2"/>
    </linearGradient>
    <linearGradient id="glass" x1="68" y1="52" x2="160" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18A67F" stop-opacity="0.88"/><stop offset="1" stop-color="#05473A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
    <path id="rub" fill-rule="evenodd" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z"/>
    <clipPath id="in"><use href="#rub"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <use href="#rub" fill="#0A6B52" opacity="0.35" transform="translate(0 14)" filter="url(#shadow)"/>
  <use href="#rub" fill="url(#glass)" stroke="url(#glass)" stroke-width="6" stroke-linejoin="round"/>
  <path clip-path="url(#in)" d="M60 40 H120 L60 140 Z" fill="#FFFFFF" opacity="0.3"/>
  <use href="#rub" fill="none" stroke="#B9FFE3" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round" transform="translate(-1 -1)"/>
</svg>
