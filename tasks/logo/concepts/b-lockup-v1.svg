<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 256" width="800" height="256" role="img" aria-labelledby="title">
  <title id="title">Равновесие — знак с надписью</title>
  <!-- Набросок: надпись — живой текст системным шрифтом, имя рабочее. В готовом знаке буквы строятся контурами. -->
  <g id="symbol" fill="#111111">
    <rect x="28" y="146" width="200" height="72" rx="52" ry="36"/>
    <rect x="52" y="86" width="136" height="52" rx="40" ry="26"/>
    <rect x="94" y="38" width="80" height="40" rx="28" ry="20"/>
  </g>
  <text id="wordmark" x="276" y="166" fill="#111111" font-family="Segoe UI, Roboto, sans-serif" font-weight="600" font-size="112">Финансы</text>
</svg>
