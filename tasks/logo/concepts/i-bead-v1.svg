<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Костяшка</title>
  <!-- Набросок значка: спица счётов и три глянцевые костяшки — две вместе, одна отложена. Счёт идёт. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A45"/><stop offset="1" stop-color="#E5245A"/>
    </linearGradient>
    <radialGradient id="bead" cx="0.35" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.18" stop-color="#FFF4D6"/><stop offset="0.55" stop-color="#FFC93C"/><stop offset="1" stop-color="#D9780A"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect x="20" y="122" width="216" height="12" rx="6" fill="#7A0F2E" fill-opacity="0.55"/>
  <g fill="#7A0F2E" opacity="0.45" filter="url(#shadow)" transform="translate(0 14)">
    <ellipse cx="66" cy="128" rx="30" ry="46"/><ellipse cx="126" cy="128" rx="30" ry="46"/><ellipse cx="196" cy="128" rx="30" ry="46"/>
  </g>
  <ellipse cx="66" cy="128" rx="30" ry="46" fill="url(#bead)"/>
  <ellipse cx="126" cy="128" rx="30" ry="46" fill="url(#bead)"/>
  <ellipse cx="196" cy="128" rx="30" ry="46" fill="url(#bead)"/>
</svg>
