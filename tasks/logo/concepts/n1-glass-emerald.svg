<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Стекло · изумруд</title>
  <!-- Набросок значка: матовое стекло на изумрудном, мятное свечение из глубины, косой блик по стеклу. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#109172"/><stop offset="1" stop-color="#052E24"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="124" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CF0B4" stop-opacity="0.8"/><stop offset="0.6" stop-color="#3CF0B4" stop-opacity="0.14"/><stop offset="1" stop-color="#3CF0B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="68" y1="52" x2="160" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/><stop offset="1" stop-color="#C9FFEA" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="rub" fill-rule="evenodd" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z"/>
    <clipPath id="in"><use href="#rub"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#glow)"/>
  <use href="#rub" fill="#01140F" opacity="0.45" transform="translate(0 14)" filter="url(#shadow)"/>
  <use href="#rub" fill="url(#glass)" stroke="url(#glass)" stroke-width="6" stroke-linejoin="round"/>
  <path clip-path="url(#in)" d="M60 40 H120 L60 140 Z" fill="#FFFFFF" opacity="0.55"/>
  <use href="#rub" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="2" stroke-linejoin="round"/>
</svg>
