<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Стекло · жидкое</title>
  <!-- Набросок значка: за стеклом плывут два цветных пятна, лаймовое и бирюзовое; в знаке они видны
       размытыми и светлее, как сквозь матовое стекло. -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur-more" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="rub" fill-rule="evenodd" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z"/>
    <clipPath id="in"><use href="#rub"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="#063A2E"/>
  <g filter="url(#blur)">
    <circle cx="66" cy="70" r="64" fill="#A6FF3C"/>
    <circle cx="206" cy="196" r="76" fill="#14D6C4"/>
  </g>
  <use href="#rub" fill="#01140F" opacity="0.45" transform="translate(0 14)" filter="url(#shadow)"/>
  <g clip-path="url(#in)">
    <rect width="256" height="256" fill="#0B4A3B"/>
    <g filter="url(#blur-more)">
      <circle cx="74" cy="80" r="70" fill="#C8FF70"/>
      <circle cx="196" cy="186" r="80" fill="#5AF0E2"/>
    </g>
    <rect width="256" height="256" fill="#FFFFFF" opacity="0.46"/>
    <path d="M60 40 H120 L60 140 Z" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <use href="#rub" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
