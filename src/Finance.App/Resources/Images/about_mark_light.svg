<!-- Дневной рубль — знак на экране «О программе» в светлой теме. Неон на светлой атмосфере гаснет,
     поэтому то же стекло здесь светлое, кромка — цветом действия (AccentLight), а вместо свечения —
     зелёная тень, как у поверхностей стиля «Изумруд» в светлой теме (LiftShadow). Геометрия та же,
     что у about_mark_dark.svg; тень сдвинута вниз, и область фильтра — весь холст. -->
<svg width="220" height="220" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glass" x1="68" y1="52" x2="160" y2="204" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#E9FFF6" stop-opacity="0.95" />
            <stop offset="1" stop-color="#9FE3C8" stop-opacity="0.9" />
        </linearGradient>
        <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
            <feGaussianBlur stdDeviation="7" />
        </filter>
        <clipPath id="in">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z" />
        </clipPath>
    </defs>
    <path filter="url(#shadow)" transform="translate(0 7)" fill="#0F5C4C" fill-rule="evenodd" opacity="0.32" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z" />
    <path fill="url(#glass)" fill-rule="evenodd" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z" />
    <path clip-path="url(#in)" fill="#FFFFFF" opacity="0.7" d="M60 40 H120 L60 140 Z" />
    <path fill="none" stroke="#0F5C4C" stroke-width="4.5" stroke-linejoin="round" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z" />
    <path fill="none" stroke="#2DBC55" stroke-width="1.5" stroke-linejoin="round" opacity="0.8" d="M88 52 H146 A42 42 0 0 1 146 136 H114 V154 H152 V176 H114 V204 H88 V176 H68 V154 H88 Z M114 76 H146 A18 18 0 0 1 146 112 H114 Z" />
</svg>
