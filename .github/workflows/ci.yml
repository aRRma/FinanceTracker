name: CI

# Проверка по ручному запуску: тесты и сборка всего решения. dotnet test не собирает
# Finance.App, и ошибка страницы без этой проверки всплыла бы только при выпуске релиза.
# Отладочная сборка — без AOT и подписи, в несколько раз быстрее релизной.
# Запуск на каждый push в master и на запросы на слияние снят по решению пользователя
# (2 октября 2026): тесты и сборку приложения всё равно проходит релиз по тегу.
on:
  workflow_dispatch:

permissions:
  contents: read

# Новый ручной запуск на той же ветке отменяет недоделанный прежний: важен результат последнего
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android

      - name: Тесты
        run: dotnet test -v q

      - name: Сборка решения
        run: dotnet build Finance.slnx -v q "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
