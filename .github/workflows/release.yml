name: Release

# Релиз по тегу vX.Y.Z: тесты, APK под arm64, подписанный своим ключом, выкладка в релиз GitHub.
# Версия и versionCode выводятся из тега и перекрывают значения из Finance.App.csproj:
# заданное через -p: свойство у MSBuild глобальное. Ключ и пароль — в секретах репозитория
# ANDROID_KEYSTORE_BASE64 и ANDROID_KEY_PASS; порядок публикации — навык build.
#
# Ручной запуск (Actions → Release → Run workflow) — пробная сборка: всё то же самое,
# но релиз не создаётся, APK остаётся в артефактах прогона.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия пробной сборки, X.Y.Z'
        required: true
        default: '0.0.1'

permissions:
  contents: write

# Два прогона одного тега не выкладывают релиз наперегонки
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: pwsh

jobs:
  release:
    # Windows — как рабочая машина: те же пути, культура и сборка, что проверены локально
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # Полная история с тегами — для проверки ветки, сравнения версий и списка изменений
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Всё, что валит релиз без сборки, проверяется до установки MAUI и тестов,
      # а не через десять минут после старта
      - name: Секреты
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'нет секрета ANDROID_KEYSTORE_BASE64' }
          if (-not $env:KEY_PASS) { throw 'нет секрета ANDROID_KEY_PASS' }

      # Имя тега и ввод ручного запуска приходят переменными, а не подстановкой в текст скрипта:
      # подстановка исполнила бы всё, что в них написано
      - name: Версия
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT -eq 'push') { $env:TAG -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "версия «$version» не вида X.Y.Z (тег — vX.Y.Z)" }
          # versionCode = major*10000 + minor*100 + patch: на меньший Android обновление не ставит,
          # а минор или патч больше 99 наехал бы на соседний разряд
          if ([int]$Matches[2] -gt 99 -or [int]$Matches[3] -gt 99) { throw "минор и патч — не больше 99: $version" }
          $code = [int]$Matches[1] * 10000 + [int]$Matches[2] * 100 + [int]$Matches[3]

          # Прошлый релиз — самый старший из прочих тегов vX.Y.Z. Новый обязан быть старше:
          # пакет с меньшим versionCode выйдет, но телефон его поверх не поставит
          $previous = git tag --list 'v*' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and $_ -ne "v$version" } |
            Sort-Object { [version]($_ -replace '^v', '') } | Select-Object -Last 1
          if ($env:EVENT -eq 'push' -and $previous -and [version]$version -le [version]($previous -replace '^v', '')) {
            throw "версия $version не старше прошлого релиза $previous"
          }

          "display=$version" >> $env:GITHUB_OUTPUT
          "code=$code" >> $env:GITHUB_OUTPUT
          "apk=FinanceTracker-$version.apk" >> $env:GITHUB_OUTPUT
          "previous=$previous" >> $env:GITHUB_OUTPUT

      - name: Тег на master
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'тег стоит не на коммите из master' }

      - uses: ./.github/actions/setup-android

      # В той же конфигурации, что уходит на телефон: публикация следом берёт уже собранные библиотеки
      - name: Тесты
        run: dotnet test -c Release -v q

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: '[IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))'

      - name: Публикация
        env:
          FINANCE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          dotnet publish src/Finance.App/Finance.App.csproj -f net10.0-android -c Release -r android-arm64 `
            -p:AndroidPackageFormat=apk `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.display }} `
            -p:ApplicationVersion=${{ steps.version.outputs.code }} `
            -p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$env:RUNNER_TEMP\release.keystore" -p:AndroidSigningKeyAlias=finance `
            -p:AndroidSigningStorePass=env:FINANCE_KEY_PASS -p:AndroidSigningKeyPass=env:FINANCE_KEY_PASS `
            "-p:AndroidSdkDirectory=$env:ANDROID_HOME" -o publish
          if ($LASTEXITCODE -ne 0) { throw 'публикация упала' }

      # Код выхода публикации подпись не подтверждает: после упавшей подписи в папке
      # всё равно лежит -Signed.apk. Сверяется сертификат — ровно тот, что у ключа пользователя.
      # Рядом кладётся контрольная сумма: по ней скачанный пакет сверяют с выложенным
      - name: Проверка подписи
        env:
          APK: ${{ steps.version.outputs.apk }}
        run: |
          $signed = 'publish\ru.finance.tracker-Signed.apk'
          $tools = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $certs = & "$($tools.FullName)\apksigner.bat" verify --print-certs $signed | Out-String
          if ($LASTEXITCODE -ne 0) { throw "пакет не подписан: $certs" }
          if ($certs -notmatch 'bff51e9bf69ac593206508aa20d42ea90db39e865458ee7e2a183f1dbaf7794d') { throw "пакет подписан чужим ключом: $certs" }
          Copy-Item $signed $env:APK
          "$((Get-FileHash $env:APK -Algorithm SHA256).Hash.ToLowerInvariant())  $env:APK" | Set-Content "$env:APK.sha256" -Encoding ascii

      # Пакет остаётся в прогоне в любом случае: у пробной сборки это единственный выход,
      # у релиза — запас на случай, если упадёт сама выкладка
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.apk }}
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
          retention-days: 30

      # Список изменений — заголовки коммитов с прошлого релиза: коммиты идут прямо в master,
      # и заметки GitHub по pull request'ам вышли бы пустыми.
      # Повторный прогон того же тега не падает на «релиз уже есть», а заменяет файлы
      - name: Релиз
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.display }}
          APK: ${{ steps.version.outputs.apk }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:APK "$env:APK.sha256" --clobber
          } else {
            # Заголовки коммитов по-русски: без явной кодировки вывод git прочитался бы кракозябрами
            [Console]::OutputEncoding = [Text.Encoding]::UTF8
            # У первого релиза прошлого тега нет — хватит последних коммитов, а не всей истории
            $changes = if ($env:PREVIOUS) { git log "$($env:PREVIOUS)..HEAD" --no-merges --format='- %s' }
                       else { git log -n 30 --no-merges --format='- %s' }
            $notes = if ($env:PREVIOUS) { "Изменения с $($env:PREVIOUS):" } else { 'Последние изменения:' }
            ($notes, '', $changes) | Set-Content notes.md -Encoding utf8
            gh release create $env:TAG $env:APK "$env:APK.sha256" --title $env:VERSION --notes-file notes.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'выкладка в релиз упала' }

      - name: Удаление ключа
        if: always()
        run: Remove-Item "$env:RUNNER_TEMP\release.keystore" -Force -ErrorAction SilentlyContinue
